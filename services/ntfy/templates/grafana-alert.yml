# Plain-text message from annotations (Grafana's .message is markdown, ntfy shows it raw) + priority from the alert severity label
# (the built-in ignores ?priority=). Used by Grafana: ?template=grafana-alert
title: |
  {{- if eq .status "firing" }}
  🚨 {{ .title | default "Alert firing" }}
  {{- else if eq .status "resolved" }}
  ✅ {{ .title | default "Alert resolved" }}
  {{- else }}
  ⚠️ Unknown alert: {{ .title | default "Alert" }}
  {{- end }}
message: |
  {{- range .alerts }}
  {{ .annotations.summary | default .labels.alertname }}{{ if and (eq .status "firing") .annotations.description }}
  {{ .annotations.description }}{{ end }}
  {{ end }}
priority: |
  {{- if ne .status "firing" }}3
  {{- else if eq (dig "commonLabels" "severity" "" .) "critical" }}5
  {{- else }}4
  {{- end }}
