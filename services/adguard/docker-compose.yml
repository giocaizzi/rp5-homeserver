# =============================================================================
# YAML Anchors - Common configurations
# =============================================================================
x-labels-base: &labels-base
  com.giocaizzi.namespace: "adguard"
  com.giocaizzi.env: "production"

x-deploy-base: &deploy-base
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.role == manager
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s
  # Host-mode ports can't be bound twice: stop the old task before starting the new one.
  update_config:
    order: stop-first

x-logging-base: &logging-base
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security-base: &security-base
  security_opt:
    - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================
networks:
  # Private network for adguard stack
  adguard_network:
    driver: overlay
    name: rp5_adguard
  
  # External network to connect to nginx proxy
  public_network:
    external: true
    name: rp5_public

# =============================================================================
# Services
# =============================================================================
services:
  dns:
    image: adguard/adguardhome:latest
    hostname: adguard-dns
    ports:
      # mode: host bypasses the ingress mesh so AdGuard sees real client IPs
      # (per-client stats and ratelimit) instead of 10.0.0.2 for the whole LAN.
      # DNS
      - { target: 53, published: 53, protocol: tcp, mode: host }
      - { target: 53, published: 53, protocol: udp, mode: host }
      # DNS-over-TLS / DNS-over-QUIC
      - { target: 853, published: 853, protocol: tcp, mode: host }
      - { target: 853, published: 853, protocol: udp, mode: host }
      # DNSCrypt
      - { target: 5443, published: 5443, protocol: tcp, mode: host }
      - { target: 5443, published: 5443, protocol: udp, mode: host }
    expose:
      # Web interface (proxied via nginx)
      - "3000"
    environment:
      - TZ=Europe/Rome
      - AGH_CONFIG_PATH=/opt/adguardhome/conf/AdGuardHome.yaml
      - AGH_WORK_DIR=/opt/adguardhome/work
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks:
      - adguard_network
      - public_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      <<: *labels-base
      com.giocaizzi.service: "dns"
      com.giocaizzi.component: "gateway"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "adguard"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 512M
    logging:
      <<: *logging-base

volumes:
  adguard_work:
    driver: local
  adguard_conf:
    driver: local