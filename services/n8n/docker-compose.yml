# =============================================================================
# YAML Anchors - Common configurations
# =============================================================================
x-labels-base: &labels-base
  com.giocaizzi.namespace: "n8n"
  com.giocaizzi.env: "production"

x-deploy-base: &deploy-base
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.role == manager
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s

x-logging-base: &logging-base
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security-base: &security-base
  security_opt:
    - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================
networks:
  # Database internal network - shared postgres in infra
  db_network:
    external: true
    name: rp5_db
  
  # External network to connect to nginx proxy
  public_network:
    external: true
    name: rp5_public
  
  # External network for observability (Alloy scraping, OTLP traces to Alloy)
  observability_network:
    external: true
    name: rp5_observability

# =============================================================================
# Services
# =============================================================================
services:
  app:
    image: n8nio/n8n:latest
    hostname: n8n-app
    expose:
      - "5678"
    environment:
      # Network configuration
      - N8N_HOST=n8n.${DOMAIN:?set DOMAIN in the stack env}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_LISTEN_ADDRESS=0.0.0.0
      
      # Timezone
      - GENERIC_TIMEZONE=Europe/Rome
      - TZ=Europe/Rome
      
      # Database configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/postgres_password
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_SSL_ENABLED=false
      
      # Security configuration
      - N8N_SECURE_COOKIE=true
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD_FILE=/run/secrets/n8n_auth_password
      
      # Security settings for deprecation warnings
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      
      # File permissions
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      # Proxy configuration - trust nginx reverse proxy
      - N8N_PROXY_HOPS=1
      
      # Performance and features
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      # Telemetry host (telemetry.n8n.io) is DNS-blocked (0.0.0.0) -> ECONNREFUSED 0.0.0.0:443 spam
      - N8N_DIAGNOSTICS_ENABLED=false
      # OpenTelemetry traces of workflow runs (Preview) -> Alloy -> Tempo. Production
      # executions only; agent prompts and tool I/O stay out of the spans.
      - N8N_OTEL_ENABLED=true
      - N8N_OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - N8N_OTEL_EXPORTER_OTLP_ENDPOINT=http://observability-collector:4317
      - N8N_OTEL_EXPORTER_SERVICE_NAME=n8n
      - N8N_AGENTS_TRACING_RECORD_INPUTS=false
      - N8N_AGENTS_TRACING_RECORD_OUTPUTS=false
      # Main heap bounded under the 1536M limit; the JS runner does not inherit
      # NODE_OPTIONS (allowlisted env), it gets N8N_RUNNERS_MAX_OLD_SPACE_SIZE.
      - NODE_OPTIONS=--max-old-space-size=384
      - N8N_RUNNERS_MAX_OLD_SPACE_SIZE=256
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=3
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      
      # Webhook configuration for reverse proxy
      - WEBHOOK_URL=https://n8n.${DOMAIN:?set DOMAIN in the stack env}
      
      # Security headers
      - N8N_ADDITIONAL_ALLOWED_ORIGINS=https://n8n.${DOMAIN:?set DOMAIN in the stack env}
    secrets:
      - postgres_password
      - n8n_auth_password
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - db_network
      - public_network
      - observability_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      <<: *labels-base
      com.giocaizzi.service: "app"
      com.giocaizzi.component: "app"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "n8n"
    <<: *security-base
    user: "1000:1000"
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 1536M
    tmpfs:
      - /tmp
    logging:
      <<: *logging-base

volumes:
  n8n_data:
    driver: local

secrets:
  postgres_password:
    external: true
    name: n8n_postgres_password
  n8n_auth_password:
    external: true
    name: n8n_auth_password
