# PostgreSQL Configuration for Langfuse
# Optimized for Raspberry Pi 5 ARM64 (8GB RAM)
# Service memory limit: 256M

# =============================================================================
# Memory Configuration
# =============================================================================
shared_buffers = 64MB
effective_cache_size = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
huge_pages = off  # avoid hugepage mmap attempts inside the cgroup

# =============================================================================
# Connections
# =============================================================================
listen_addresses = '*'
max_connections = 20

# =============================================================================
# WAL Configuration
# =============================================================================
wal_level = replica
max_wal_size = 128MB
min_wal_size = 32MB
wal_compression = on
wal_buffers = 2MB

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# =============================================================================
# Planner Configuration
# =============================================================================
random_page_cost = 1.1
jit = off  # LLVM JIT costs RAM/CPU and never pays off for OLTP on a Pi
max_parallel_workers_per_gather = 0  # each parallel worker needs its own work_mem
effective_io_concurrency = 200  # NVMe

# =============================================================================
# Logging
# =============================================================================
log_min_duration_statement = 1000
log_checkpoints = on

# =============================================================================
# Autovacuum (reduced for ARM64)
# =============================================================================
autovacuum_max_workers = 2
autovacuum_vacuum_cost_limit = 100

# =============================================================================
# Background Writer
# =============================================================================
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
