# =============================================================================
# YAML Anchors - Common configurations
# =============================================================================
x-labels-base: &labels-base
  com.giocaizzi.namespace: "firefly"
  com.giocaizzi.env: "production"
  com.giocaizzi.config-rev: "0.3.1" # x-release-please-version — bumped per release so tasks re-bind fresh Portainer clone

x-deploy-base: &deploy-base
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.role == manager
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s

x-logging-base: &logging-base
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security-base: &security-base
  security_opt:
    - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================
networks:
  # Private network for firefly stack
  firefly_network:
    driver: overlay
    name: rp5_firefly
  
  # External network to connect to nginx proxy
  public_network:
    external: true
    name: rp5_public
  
  # External network for observability (Alloy scraping)
  observability_network:
    external: true
    name: rp5_observability

# =============================================================================
# Services
# =============================================================================
services:
  app:
    image: ghcr.io/giocaizzi/firefly-iii:mcp
    hostname: firefly-app
    stop_grace_period: 30s # default 10s SIGKILLs (exit 137) in-flight requests on update (#316)
    # Image STOPSIGNAL is SIGQUIT, a no-op for s6-svscan (PID 1) -> always SIGKILLed (137).
    # SIGTERM runs s6 shutdown. No init: true, s6-overlay must be PID 1 (#316)
    stop_signal: SIGTERM
    expose:
      - "8080"
    environment:
      # Application configuration
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://firefly.${DOMAIN:?set DOMAIN in the stack env}
      - SITE_OWNER=admin@firefly.home
      - DEFAULT_LANGUAGE=en_US
      - DEFAULT_LOCALE=equal
      
      # Timezone
      - TZ=Europe/Rome
      
      # Database configuration
      - DB_CONNECTION=mysql
      - DB_HOST=firefly-db
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD_FILE=/run/secrets/db_password
      
      # Security & Trust
      - TRUSTED_PROXIES=**
      - APP_LOG_LEVEL=notice
      - AUDIT_LOG_LEVEL=emergency
      - APP_KEY_FILE=/run/secrets/app_key
      - STATIC_CRON_TOKEN_FILE=/run/secrets/static_cron_token
      
      # Mail configuration (optional)
      - MAIL_MAILER=log
      - MAIL_HOST=
      - MAIL_PORT=2525
      - MAIL_FROM=changeme@example.com
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_ENCRYPTION=
      
      # Authentication
      - LOGIN_PROVIDER=eloquent
      
      # Feature flags
      - DISABLE_FRAME_HEADER=false
      - DISABLE_CSP_HEADER=false

      # php-fpm / OPcache (serversideup/php env spec; image defaults 20 / 1)
      - PHP_FPM_PM_MAX_CHILDREN=4
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    secrets:
      - app_key
      - db_password
      - static_cron_token
    volumes:
      - ./scripts/load-secrets.sh:/etc/cont-init.d/00-load-secrets:ro
      # Keep the web cron token (URL path) out of the access log
      - ./nginx/log-map.conf:/etc/nginx/conf.d/firefly-log-map.conf:ro
      - ./nginx/access-log.conf:/etc/nginx/server-opts.d/firefly-access-log.conf:ro
      # Persist the entire Laravel storage tree — most importantly
      # storage/oauth-{public,private}.key. Without this, container recreate
      # regenerates the keys and invalidates every Personal Access Token.
      - firefly_storage:/var/www/html/storage
      # Attachments live in a separate volume, nested-mounted so user uploads
      # survive even if firefly_storage is ever rebuilt.
      - firefly_upload:/var/www/html/storage/upload
    networks:
      - firefly_network
      - public_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      <<: *labels-base
      com.giocaizzi.service: "app"
      com.giocaizzi.component: "app"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "firefly"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 768M
    logging:
      <<: *logging-base

  db:
    image: mariadb:12.3   # series-pinned: :lts jumps across major series (see #185)
    hostname: firefly-db
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_DATABASE=firefly
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    secrets:
      - db_password
    volumes:
      - ./mariadb/mariadb.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - firefly_db:/var/lib/mysql
    networks:
      - firefly_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s
    labels:
      <<: *labels-base
      com.giocaizzi.service: "db"
      com.giocaizzi.component: "data"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "mariadb"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 384M
    logging:
      <<: *logging-base

  # MySQL/MariaDB Exporter - Metrics for Prometheus/Alloy
  db-exporter:
    image: prom/mysqld-exporter:latest
    hostname: firefly-db-exporter
    init: true # Go binary as PID 1 can't die from SIGTERM and exits 2 (#316)
    expose:
      - "9104"
    secrets:
      - db_password
    entrypoint:
      - /bin/sh
      - -c
      - |
        export MYSQLD_EXPORTER_PASSWORD=$$(cat /run/secrets/db_password)
        exec /bin/mysqld_exporter \
          --mysqld.address=firefly-db:3306 \
          --mysqld.username=firefly \
          --no-collect.slave_status \
          --no-collect.info_schema.innodb_cmp \
          --no-collect.info_schema.innodb_cmpmem
    networks:
      - firefly_network
      - observability_network
    # No healthcheck - scratch image has no shell/utilities
    # Prometheus scrape failures serve as health indicator
    labels:
      <<: *labels-base
      com.giocaizzi.service: "db-exporter"
      com.giocaizzi.component: "worker"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "mysqld-exporter"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 64M
    logging:
      <<: *logging-base

  importer:
    image: fireflyiii/data-importer:version-2   # major-pinned (see #185)
    hostname: firefly-importer
    stop_grace_period: 30s # default 10s SIGKILLs (exit 137) in-flight imports on update (#316)
    stop_signal: SIGTERM # image SIGQUIT is ignored by s6-svscan; see app (#316)
    expose:
      - "8080"
    environment:
      # Firefly III connection
      - FIREFLY_III_URL=http://firefly-app:8080
      - VANITY_URL=https://firefly.${DOMAIN:?set DOMAIN in the stack env}
      
      # Timezone and Locale
      - TZ=Europe/Rome
      - FALLBACK_LOCALE=en_US
      
      # Security
      - TRUSTED_PROXIES=**
      - EXPECT_SECURE_URL=false
      - VERIFY_TLS_SECURITY=false
      
      # Logging
      - LOG_LEVEL=info
      
      # Performance
      - USE_CACHE=true
      
      # Auto-import configuration
      - IMPORT_DIR_ALLOWLIST=/var/www/html/import
      - CAN_POST_AUTOIMPORT=true
      - CAN_POST_FILES=true
      - IGNORE_DUPLICATE_ERRORS=true   # duplicates still skipped; only stops a115 being reported as error (#300)

      # php-fpm / OPcache (serversideup/php env spec; image defaults 20 / 1)
      - PHP_FPM_PM_MAX_CHILDREN=2
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    secrets:
      - firefly_client_id
      - lunch_flow_api_key
      - auto_import_secret
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Read secrets and set environment variables
        export FIREFLY_III_CLIENT_ID=$$(cat /run/secrets/firefly_client_id)
        export LUNCH_FLOW_API_KEY=$$(cat /run/secrets/lunch_flow_api_key)
        export AUTO_IMPORT_SECRET=$$(cat /run/secrets/auto_import_secret)
        # Execute original entrypoint
        exec docker-php-serversideup-entrypoint /init
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    configs:
      - source: importer_config
        target: /var/www/html/import/config.json
        mode: 0444
    networks:
      - firefly_network
      - public_network
    healthcheck:
      test: ["CMD", "php", "-r", "echo file_get_contents('http://localhost:8080/health');"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      <<: *labels-base
      com.giocaizzi.service: "importer"
      com.giocaizzi.component: "worker"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "firefly-importer"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 512M
    logging:
      <<: *logging-base

  scheduler:
    image: python:3.13-alpine
    hostname: firefly-scheduler
    init: true # crond as PID 1 ignores SIGTERM -> SIGKILL (137) on stop (#316)
    environment:
      - TZ=Europe/Rome
      # Firefly account ids for firefly_jobs.py, from the stack env
      - CC_ACCOUNT_ID=${CC_ACCOUNT_ID:?set CC_ACCOUNT_ID in the stack env}
      - CC_SETTLEMENT_SOURCE_ID=${CC_SETTLEMENT_SOURCE_ID:?set CC_SETTLEMENT_SOURCE_ID in the stack env}
      - CC_RESIDUAL_ACCOUNT_ID=${CC_RESIDUAL_ACCOUNT_ID:?set CC_RESIDUAL_ACCOUNT_ID in the stack env}
      # Optional, comma-separated: tags summarised every Monday; card-import row
      # prefixes to skip (card-funded top-ups already booked on the receiving account).
      # Optional: word before the statement close date in the settlement text
      - REVIEW_TAGS=${FIREFLY_REVIEW_TAGS:-}
      - CC_IMPORT_SKIP_PREFIXES=${FIREFLY_CC_SKIP_PREFIXES:-}
      - CC_CLOSE_MARKER=${FIREFLY_CC_CLOSE_MARKER:-}
      # ntfy over the shared rp5_public network
      - NTFY_URL=http://ntfy_app/firefly
    secrets:
      - auto_import_secret
      - firefly_access_token
      - static_cron_token
      - lunch_flow_api_key
      - ntfy_token
    configs:
      - source: importer_config
        target: /etc/firefly/importer.json
        mode: 0444
    volumes:
      - ./scripts/firefly_jobs.py:/usr/local/bin/firefly_jobs.py:ro
    command: >
      sh -c "apk add --no-cache tzdata wget &&
      ln -sf /usr/share/zoneinfo/Europe/Rome /etc/localtime &&
      echo 'Waiting for Firefly to be ready...' &&
      until wget -q --spider http://firefly-app:8080/health; do echo 'Waiting...'; sleep 30; done &&
      echo 'Firefly is ready, setting up cron jobs...' &&
      echo '0 6 * * * wget -qO- http://firefly-app:8080/api/v1/cron/\$$(cat /run/secrets/static_cron_token)' > /tmp/crontab &&
      echo '0 6 * * * wget -qO- --post-data=\"directory=/var/www/html/import&secret=\$$(cat /run/secrets/auto_import_secret)\" --header=\"Accept: application/json\" --header=\"Authorization: Bearer \$$(cat /run/secrets/firefly_access_token)\" http://firefly-importer:8080/autoimport' >> /tmp/crontab &&
      export -p | grep -E \"^export (CC_|REVIEW_TAGS|NTFY_URL|TZ)\" > /tmp/jobs.env &&
      echo '0 7 * * * . /tmp/jobs.env && python3 /usr/local/bin/firefly_jobs.py daily >> /proc/1/fd/1 2>&1' >> /tmp/crontab &&
      crontab /tmp/crontab &&
      rm /tmp/crontab &&
      echo 'Cron jobs configured' &&
      exec crond -f -L /dev/stdout"
    networks:
      - firefly_network
      - public_network
    labels:
      <<: *labels-base
      com.giocaizzi.service: "scheduler"
      com.giocaizzi.component: "worker"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "alpine"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 64M
    logging:
      <<: *logging-base

volumes:
  firefly_storage:
    driver: local
  firefly_upload:
    driver: local
  firefly_db:
    driver: local

configs:
  importer_config:
    external: true
    name: firefly_importer_config

secrets:
  app_key:
    external: true
    name: firefly_app_key
  db_password:
    external: true
    name: firefly_db_password
  static_cron_token:
    external: true
    name: firefly_static_cron_token
  firefly_client_id:
    external: true
    name: firefly_client_id
  auto_import_secret:
    external: true
    name: firefly_auto_import_secret
  firefly_access_token:
    external: true
    name: firefly_access_token
  lunch_flow_api_key:
    external: true
    name: firefly_lunch_flow_api_key
  # Publisher token for the self-hosted ntfy topic `firefly` (user `alerts`, write-only).
  ntfy_token:
    external: true
    name: firefly_ntfy_token
