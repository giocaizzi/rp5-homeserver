# =============================================================================
# YAML Anchors - Common configurations
# =============================================================================
x-labels-base: &labels-base
  com.giocaizzi.namespace: "crm"
  com.giocaizzi.env: "production"

x-deploy-base: &deploy-base
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.role == manager
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s

x-logging-base: &logging-base
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security-base: &security-base
  security_opt:
    - no-new-privileges:true

# Shared by server + worker. Twenty has no *_FILE support, so the entrypoint
# wrapper below builds PG_DATABASE_URL / ENCRYPTION_KEY from Swarm secrets.
x-twenty-env: &twenty-env
  SERVER_URL: "https://crm.${DOMAIN:?set DOMAIN in the stack env}"
  REDIS_URL: "redis://redis:6379"
  STORAGE_TYPE: "local"
  PG_POOL_MAX_CONNECTIONS: "5"
  TELEMETRY_ENABLED: "false"
  LOG_LEVELS: "error,warn"             # default adds "log": ~28k cron lines/day
  NODE_OPTIONS: "--max-old-space-size=512"

# Wraps the original /app/entrypoint.sh (migrations + cron registration),
# then execs the service command passed as args.
x-twenty-entrypoint: &twenty-entrypoint
  - /bin/sh
  - -c
  - |
    export PG_DATABASE_URL="postgres://twenty:$$(cat /run/secrets/postgres_password)@postgres:5432/twenty"
    export ENCRYPTION_KEY="$$(cat /run/secrets/encryption_key)"
    exec /app/entrypoint.sh "$$@"
  - --

# =============================================================================
# Networks
# =============================================================================
networks:
  # Database internal network - shared postgres and redis in infra
  db_network:
    external: true
    name: rp5_db

  # External network for observability (Alloy scraping)
  observability_network:
    external: true
    name: rp5_observability

  # External network to connect to nginx proxy
  public_network:
    external: true
    name: rp5_public

# =============================================================================
# Services
# =============================================================================
services:
  server:
    image: twentycrm/twenty:v2.51.0
    hostname: crm-server
    expose:
      - "3000"
    entrypoint: *twenty-entrypoint
    command: ["node", "dist/main"]
    environment:
      <<: *twenty-env
      NODE_PORT: "3000"
    secrets:
      - postgres_password
      - encryption_key
    volumes:
      - storage_data:/app/packages/twenty-server/.local-storage
    networks:
      - db_network
      - public_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s                # first boot runs DB init + upgrade
    labels:
      <<: *labels-base
      com.giocaizzi.service: "server"
      com.giocaizzi.component: "app"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "twenty"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 1536M
    logging:
      <<: *logging-base

  worker:
    image: twentycrm/twenty:v2.51.0
    hostname: crm-worker
    entrypoint: *twenty-entrypoint
    command: ["node", "dist/queue-worker/queue-worker"]   # = yarn worker:prod, minus yarn
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"               # server runs migrations
      DISABLE_CRON_JOBS_REGISTRATION: "true"      # server registers crons
    secrets:
      - postgres_password
      - encryption_key
    volumes:
      - storage_data:/app/packages/twenty-server/.local-storage
    networks:
      - db_network
    labels:
      <<: *labels-base
      com.giocaizzi.service: "worker"
      com.giocaizzi.component: "worker"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "twenty"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 1536M
    logging:
      <<: *logging-base

volumes:
  storage_data:
    driver: local

secrets:
  postgres_password:
    external: true
    name: crm_postgres_password
  encryption_key:
    external: true
    name: crm_encryption_key
