apiVersion: 1

providers:
  # Observability stack dashboards (Loki, Tempo, Prometheus health)
  - name: 'observability'
    orgId: 1
    folder: 'observability'
    folderUid: 'observability'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/observability

  # Website stack dashboards
  - name: 'website'
    orgId: 1
    folder: 'Website'
    folderUid: 'website'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/website

  # Shared technology dashboards (PostgreSQL, MariaDB, Redis, Nginx)
  - name: 'shared'
    orgId: 1
    folder: 'shared'
    folderUid: 'shared'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/shared

  # Every agent harness (Claude Code, Codex, Copilot, opencode, pi), the guard and the Claude Code detail
  - name: 'agents'
    orgId: 1
    folder: 'Agents'
    folderUid: 'agents'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/agents
