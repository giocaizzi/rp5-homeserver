apiVersion: 1

groups:
  # ===========================================
  # Database Alerts
  # ===========================================
  - orgId: 1
    name: Database Alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: postgres-down
        title: PostgreSQL Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: pg_up
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: PostgreSQL instance {{ $labels.service_namespace }}/{{ $labels.service_name }} is down
          description: The PostgreSQL exporter is unable to connect to the database.
        labels:
          severity: critical
        isPaused: false

      - uid: postgres-low-cache-hit
        title: PostgreSQL Low Cache Hit Ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum by (service_namespace, service_name) (pg_stat_database_blks_hit) / (sum by (service_namespace, service_name) (pg_stat_database_blks_hit) + sum by (service_namespace, service_name) (pg_stat_database_blks_read))) * 100
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: PostgreSQL cache hit ratio is low for {{ $labels.service_namespace }}/{{ $labels.service_name }}
          description: Cache hit ratio is {{ $value | printf "%.1f" }}% (threshold 90%).
        labels:
          severity: warning

      - uid: mariadb-down
        title: MariaDB Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: mysql_up
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: MariaDB instance {{ $labels.service_namespace }}/{{ $labels.service_name }} is down
          description: The MySQL exporter is unable to connect to the database.
        labels:
          severity: critical

  # ===========================================
  # Redis Alerts
  # ===========================================
  - orgId: 1
    name: Redis Alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: redis-down
        title: Redis Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: redis_up
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: OK # no redis exporter scraped today; NoData would page forever
        execErrState: Error
        for: 2m
        annotations:
          summary: Redis instance {{ $labels.service_namespace }}/{{ $labels.service_name }} is down
          description: The Redis exporter is unable to connect to Redis.
        labels:
          severity: critical

      - uid: redis-high-memory
        title: Redis High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: redis_memory_used_bytes / redis_memory_max_bytes * 100
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK # no redis exporter scraped today; NoData would page forever
        execErrState: Error
        for: 5m
        annotations:
          summary: Redis memory usage is high for {{ $labels.service_namespace }}/{{ $labels.service_name }}
          description: Memory usage is at {{ $value | printf "%.1f" }}% (threshold 80%).
        labels:
          severity: warning

  # ===========================================
  # Exporter Health Alerts
  # ===========================================
  - orgId: 1
    name: Exporter Health
    folder: Alerts
    interval: 1m
    rules:
      - uid: exporter-down
        title: Metrics Exporter Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job!~"loki|tempo|alloy"} # every scraped target; those three have dedicated rules
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Metrics exporter {{ $labels.service_namespace }}/{{ $labels.service_name }} is down
          description: The exporter at {{ $labels.instance }} has been down for 5 minutes.
        labels:
          severity: warning

  # ===========================================
  # Observability Stack Alerts
  # ===========================================
  - orgId: 1
    name: Observability Stack
    folder: Alerts
    interval: 1m
    rules:
      - uid: loki-down
        title: Loki Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="loki"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Loki is down
          description: The Loki log aggregation service is unreachable.
        labels:
          severity: critical

      - uid: tempo-down
        title: Tempo Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="tempo"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Tempo is down
          description: The Tempo distributed tracing service is unreachable.
        labels:
          severity: critical

      - uid: alloy-down
        title: Alloy Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="alloy"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Alloy is down
          description: The Alloy telemetry collector is unreachable.
        labels:
          severity: critical

  # ===========================================
  # HTTP / Log Error Alerts (Loki)
  # ===========================================
  # nginx logs: level="error" <=> status >= 500 (see alloy/modules/nginx_logs.alloy).
  # Instant LogQL queries; an empty result (no breach) is NoData -> OK.
  - orgId: 1
    name: HTTP Errors
    folder: Alerts
    interval: 1m
    rules:
      - uid: nginx-5xx-ratio
        title: Nginx 5xx Error Ratio High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: >-
                (
                  sum by (vhost) (count_over_time({technology="nginx", level="error"}[5m]))
                  / sum by (vhost) (count_over_time({technology="nginx", vhost!=""}[5m]))
                ) * 100 > 5
                and sum by (vhost) (count_over_time({technology="nginx", level="error"}[5m])) >= 5
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: 5xx responses on {{ $labels.vhost }}
          description: '{{ $values.B | printf "%.1f" }}% of requests returned 5xx over the last 5m (threshold 5%, min 5 errors).'
        labels:
          severity: critical

      - uid: nginx-no-logs
        title: Nginx Access Logs Silent
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              expr: sum(count_over_time({technology="nginx"}[15m]))
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: No nginx access logs reaching Loki
          description: No nginx log lines in 15m. The proxy, Alloy or Loki pipeline is broken, so 5xx alerts are blind.
        labels:
          severity: critical

      - uid: container-error-logs
        title: Container Error Logs Burst
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              # Excludes services whose `level` is a regex guess and floods errors
              # (grafana, alloy, netdata, *-exporter). Re-tune from the 24h count.
              expr: >-
                sum by (service_namespace, service_name) (
                  count_over_time({source="docker", technology!~"nginx|grafana|alloy|netdata|.*-exporter", level=~"error|critical|alert|fatal"}[10m])
                )
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Error log burst in {{ $labels.service_namespace }}/{{ $labels.service_name }}
          description: '{{ $values.B | printf "%.0f" }} error-level log lines in the last 10m (threshold 20).'
        labels:
          severity: warning
