apiVersion: 1

# ntfy via webhook + ntfy's built-in Grafana template (no native ntfy integration in Grafana 11).
# Two receivers only to set priority; routing by severity lives in policies.yaml.
# $NTFY_TOKEN is exported from the ntfy_token secret by the dashboard entrypoint.
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        settings:
          url: http://ntfy_app/grafana?template=grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $NTFY_TOKEN
  - orgId: 1
    name: ntfy-critical
    receivers:
      - uid: ntfy-critical
        type: webhook
        settings:
          url: http://ntfy_app/grafana?template=grafana&priority=urgent
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $NTFY_TOKEN
