apiVersion: 1

# ntfy via webhook (no native ntfy integration in Grafana 11), posting to the shared
# `rp5` topic with tag `grafana` (no Tags header is sent, so the `tags` query
# parameter carries it). The ntfy-side
# template services/ntfy/templates/grafana-alert.yml sets priority from `severity`.
# $NTFY_TOKEN is exported from the ntfy_token secret by the dashboard entrypoint.
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        settings:
          url: http://ntfy_app/rp5?template=grafana-alert&tags=grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $NTFY_TOKEN
