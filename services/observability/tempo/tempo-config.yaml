# =============================================================================
# Tempo Configuration
# =============================================================================
# Distributed tracing backend. Receives traces ONLY from Alloy (OTLP).
# All trace ingestion flows through Alloy for consistent processing.
#
# Trace Flow:
#   Applications → Alloy (OTLP 4317/4318) → Tempo (OTLP 4317)
#
# Do NOT send traces directly to Tempo - use Alloy endpoint instead.
# =============================================================================

server:
  http_listen_port: 3200
  log_level: info

# Receive traces from Alloy only (internal network)
distributor:
  receivers:
    otlp:
      protocols:
        # Disable HTTP receiver to enforce gRPC-only ingestion
        # via Alloy.
        # http:
        #   endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 10
      queue_depth: 1000

compactor:
  compaction:
    block_retention: 720h

# Single-node memberlist config - prevents "empty ring" errors
memberlist:
  abort_if_cluster_join_fails: false
  join_members: []

# Metrics generator: span-metrics (traces_spanmetrics_* → Prometheus) and
# local-blocks (TraceQL metrics: rate(), histogram; required by Grafana Traces
# Drilldown). local-blocks is kept small to fit the 1024M container: recent
# blocks only, no flush (older ranges are served from the trace backend).
# service-graphs stays disabled.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://observability-metrics-store:9090/api/v1/write
        send_exemplars: true
  # Single-instance deployment - no ring configuration needed
  # The generator runs embedded in the Tempo monolith
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      flush_to_storage: false
      max_block_bytes: 50000000
      complete_block_timeout: 30m

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
