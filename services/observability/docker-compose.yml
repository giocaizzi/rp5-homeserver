# Observability Stack - Centralized Monitoring, Logging, and Tracing
# Deployed via Portainer using remote repository feature

# =============================================================================
# YAML Anchors - Common configurations
# =============================================================================
x-labels-base: &labels-base
  com.giocaizzi.namespace: "observability"
  com.giocaizzi.env: "production"
  com.giocaizzi.config-rev: "0.12.0" # x-release-please-version — bumped per release so tasks re-bind fresh Portainer clone

x-deploy-base: &deploy-base
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.role == manager
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s

x-logging-base: &logging-base
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security-base: &security-base
  security_opt:
    - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================
networks:
  # Public network - for nginx proxy to reach services
  public_network:
    external: true
    name: rp5_public

  # Internal observability network
  observability_network:
    driver: overlay
    name: rp5_observability

  # Shared database network - for exporters to scrape postgres and redis
  db_network:
    external: true
    name: rp5_db
    

# =============================================================================
# Volumes
# =============================================================================
volumes:
  loki_data:
    driver: local
  tempo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alloy_data:
    driver: local

# =============================================================================
# Secrets (external - create on Pi before deployment)
# =============================================================================
secrets:
  grafana_admin_password:
    external: true
    name: observability_grafana_admin_password
  alloy_otel_bearer_token:
    external: true
    name: observability_alloy_otel_bearer_token
  ntfy_token:
    external: true
    name: observability_ntfy_token
  grafana_mcp_token:
    external: true
    name: observability_grafana_mcp_token
  grafana_mcp_server_token:
    external: true
    name: observability_grafana_mcp_server_token
  postgres_password:
    external: true
    name: infra_postgres_password

# =============================================================================
# Services
# =============================================================================
services:

  # ========================================
  # Prometheus - Metrics Storage
  # ========================================
  metrics-store:
    image: prom/prometheus:v3.5.3
    hostname: observability-metrics-store
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=3GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    stop_grace_period: 60s # TSDB/WAL flush on shutdown; default 10s SIGKILLs (#316)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      <<: *labels-base
      com.giocaizzi.service: "metrics-store"
      com.giocaizzi.component: "data"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "prometheus"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 512M
    logging:
      <<: *logging-base

  # ========================================
  # Loki - Log Aggregation
  # ========================================
  log-store:
    image: grafana/loki:3.7.8
    hostname: observability-log-store
    expose:
      - "3100"
    command: -config.file=/etc/loki/loki-config.yaml
    stop_grace_period: 60s # ingester flush on shutdown; default 10s SIGKILLs (#316)
    environment:
      - GOMEMLIMIT=520MiB # soft Go heap cap; ~80% of container limit
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - observability_network
    # Note: Loki uses scratch-based image without wget/curl, healthcheck disabled
    # Docker Swarm restart policy handles recovery
    labels:
      <<: *labels-base
      com.giocaizzi.service: "log-store"
      com.giocaizzi.component: "data"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "loki"
    <<: *security-base
    user: "root"
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 640M
    logging:
      <<: *logging-base

  # ========================================
  # Tempo - Distributed Tracing
  # ========================================
  # Receives traces ONLY from Alloy via OTLP gRPC.
  # All external trace ingestion goes through Alloy for processing.
  trace-store:
    image: grafana/tempo:2.10.5
    hostname: observability-trace-store
    expose:
      - "3200"  # Tempo HTTP (queries)
    command: -config.file=/etc/tempo/tempo-config.yaml
    # Default 10s SIGKILLs Tempo mid-flush (server.graceful_shutdown_timeout 30s,
    # generator remote_write_flush_deadline 1m) -> half-written WAL blocks (#290)
    stop_grace_period: 90s
    environment:
      - GOMEMLIMIT=820MiB # soft Go heap cap; ~80% of container limit
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - observability_network
    # Note: Tempo uses scratch-based image without wget/curl, healthcheck disabled
    # Docker Swarm restart policy handles recovery
    labels:
      <<: *labels-base
      com.giocaizzi.service: "trace-store"
      com.giocaizzi.component: "data"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "tempo"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 1024M
    logging:
      <<: *logging-base

  # ========================================
  # Grafana Alloy - OpenTelemetry Collector
  # ========================================
  collector:
    image: grafana/alloy:v1.15.1
    hostname: observability-collector
    expose:
      - "12345" # Alloy metrics
      - "4317"  # OTLP gRPC (overlay-only, unauthenticated)
      - "4318"  # OTLP HTTP (bearer-auth required)
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    stop_grace_period: 30s # default 10s SIGKILLs (#316)
    environment:
      - DEPLOYMENT_ENV=production
      - GOMEMLIMIT=480MiB # GC before memory_limiter soft limit (512MiB); ~62% of container limit
    secrets:
      - alloy_otel_bearer_token
    volumes:
      - ./alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - observability_network
      - public_network
    # Note: Alloy Debian-based image lacks wget, healthcheck disabled
    # Docker Swarm restart policy handles recovery
    labels:
      <<: *labels-base
      com.giocaizzi.service: "collector"
      com.giocaizzi.component: "worker"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "alloy"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 768M
    logging:
      <<: *logging-base

  # ========================================
  # Grafana - Dashboards and Visualization
  # ========================================
  dashboard:
    image: grafana/grafana:13.2.4
    hostname: observability-dashboard
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.home/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # Live (WebSocket) only accepts the root_url origin; allow the public host too
      - GF_LIVE_ALLOWED_ORIGINS=https://grafana.${DOMAIN:?set DOMAIN in the stack env}
      - GF_INSTALL_PLUGINS=
      - GF_FEATURE_MANAGEMENT_ALLOW_EDITING=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DATABASE_WAL=true
      - GF_LOG_LEVEL=warn
      # Soft Go heap cap so GC runs before the cgroup limit (default GOGC=100 targets ~2x live heap);
      # ~120MiB of backend plugin processes sit outside it
      - GOMEMLIMIT=512MiB
      # Provisioned dashboards default to 10s refresh
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=30s
    stop_grace_period: 30s # default 10s SIGKILLs (#316)
    secrets:
      - grafana_admin_password
      - ntfy_token
    # Alerting provisioning only interpolates env vars, so export the ntfy token
    # for contact-points.yaml, then exec the image's original entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export NTFY_TOKEN="$$(cat /run/secrets/ntfy_token)"
        exec /run.sh
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observability_network
      - public_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      <<: *labels-base
      com.giocaizzi.service: "dashboard"
      com.giocaizzi.component: "app"
      com.giocaizzi.tier: "core"
      com.giocaizzi.technology: "grafana"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "core"
      resources:
        limits:
          memory: 768M # Grafana 13: ~370MiB main process (Go heap ~290MiB) + ~120MiB plugin processes
        reservations:
          memory: 384M
    logging:
      <<: *logging-base

  # ========================================
  # Grafana MCP - read-only MCP server for Grafana (+ Prometheus/Loki/Tempo datasources)
  # ========================================
  # Reached via nginx at grafana.<zone>/mcp (public host only; CF Access + the mcp-connector
  # Worker gate it, and callers must send Authorization: Bearer <server token>). Viewer-role
  # service account.
  mcp:
    image: grafana/mcp-grafana:2.0.2   # pinned: holds the Grafana SA token; no floating major tag, bump by hand
    hostname: observability-mcp
    environment:
      - GRAFANA_URL=http://observability-dashboard:3000
      - GRAFANA_ORG_ID=1
    init: true # entrypoint is a shell wrapper; tini forwards SIGTERM (#316)
    stop_grace_period: 15s
    secrets:
      - grafana_mcp_token
      - grafana_mcp_server_token
    # Original entrypoint is the image's /app/mcp-grafana (default transport: sse), so
    # restate it with streamable-http and the tokens read from the secrets.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="$$(cat /run/secrets/grafana_mcp_token)"
        export MCP_GRAFANA_SERVER_TOKEN="$$(cat /run/secrets/grafana_mcp_server_token)"
        exec /app/mcp-grafana --transport streamable-http --address 0.0.0.0:8000 --allowed-hosts grafana.${DOMAIN:?set DOMAIN in the stack env} --disable-write
    expose:
      - "8000"
    networks:
      - observability_network
      - public_network
    # No healthcheck: the image ships no wget/curl and the server has no health flag.
    labels:
      <<: *labels-base
      com.giocaizzi.service: "mcp"
      com.giocaizzi.component: "gateway"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "mcp-grafana"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 128M
    logging:
      <<: *logging-base

  # ========================================
  # Shared PostgreSQL Exporter - Metrics for Prometheus/Alloy
  # ========================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    hostname: observability-postgres-exporter
    entrypoint:
      - /bin/sh
      - -c
      - |
        export DATA_SOURCE_NAME="postgresql://postgres:$$(cat /run/secrets/postgres_password)@postgres:5432/postgres?sslmode=disable"
        exec /bin/postgres_exporter
    secrets:
      - postgres_password
    networks:
      - db_network
      - observability_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      <<: *labels-base
      com.giocaizzi.namespace: "infra"
      com.giocaizzi.service: "postgres-exporter"
      com.giocaizzi.component: "worker"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "postgres-exporter"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 64M
    logging:
      <<: *logging-base

  # ========================================
  # Shared Redis Exporter - Metrics for Prometheus/Alloy
  # ========================================
  redis-exporter:
    image: oliver006/redis_exporter:alpine
    hostname: observability-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - db_network
      - observability_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      <<: *labels-base
      com.giocaizzi.namespace: "infra"
      com.giocaizzi.service: "redis-exporter"
      com.giocaizzi.component: "worker"
      com.giocaizzi.tier: "extra"
      com.giocaizzi.technology: "redis-exporter"
    <<: *security-base
    deploy:
      <<: *deploy-base
      labels:
        com.giocaizzi.tier: "extra"
      resources:
        limits:
          memory: 64M
    logging:
      <<: *logging-base
