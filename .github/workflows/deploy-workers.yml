# Release-gated deployment for workers/mcp-connector (Cloudflare Workers).
#
# RELEASE-GATED: fires when release-please publishes the `mcp-connector` release
# (tag `mcp-connector-vX.Y.Z`); merging a feature PR STAGES, merging the Release PR
# SHIPS. See docs/releases.md.
#
# Flow: npm ci -> typecheck -> `wrangler deploy --env <env>` for each of the Worker
# envs (one Worker `mcp-connector-<env>` each). Code-only deploy: per-env secrets
# (UPSTREAM_BEARER, CF_ACCESS_*, Google OAuth) were set once by
# workers/mcp-connector/deploy.sh and persist across deploys. wrangler.jsonc holds
# placeholders (domain, login allowlist, KV ids) rendered by render-config.sh from
# secrets on this environment (DOMAIN, ALLOWED_EMAILS, KV_ID_<ENV>), so the values
# are masked in the logs. Runs on GitHub-hosted runners (Cloudflare API, not the Pi).
#
# The `cloudflare-workers` environment holds secrets CLOUDFLARE_API_TOKEN
# (Workers Scripts:Edit, scoped to the account) and CLOUDFLARE_ACCOUNT_ID, and
# provides the audit trail + optional "Required reviewers" gate.
name: Deploy workers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      env:
        description: 'Single Worker env to deploy (empty = all).'
        type: choice
        default: all
        options: [all, greenhouse, firefly, n8n, grafana, netdata, portainer, langfuse]

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    # Release event: only the mcp-connector component. Manual runs always pass.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'mcp-connector-v')
    runs-on: ubuntu-latest
    environment: cloudflare-workers
    defaults:
      run:
        working-directory: workers/mcp-connector
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `env` in workers/mcp-connector/wrangler.jsonc.
        env: [greenhouse, firefly, n8n, grafana, netdata, portainer, langfuse]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/mcp-connector/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Render wrangler config
        # Secrets, not variables: secret values are masked everywhere in the log,
        # including this step's env header.
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          KV_ID_GREENHOUSE: ${{ secrets.KV_ID_GREENHOUSE }}
          KV_ID_FIREFLY: ${{ secrets.KV_ID_FIREFLY }}
          KV_ID_N8N: ${{ secrets.KV_ID_N8N }}
          KV_ID_GRAFANA: ${{ secrets.KV_ID_GRAFANA }}
          KV_ID_NETDATA: ${{ secrets.KV_ID_NETDATA }}
          KV_ID_PORTAINER: ${{ secrets.KV_ID_PORTAINER }}
          KV_ID_LANGFUSE: ${{ secrets.KV_ID_LANGFUSE }}
        run: ./render-config.sh

      - name: Deploy Worker
        # Single-env manual runs skip the other matrix legs.
        if: github.event_name != 'workflow_dispatch' || inputs.env == 'all' || inputs.env == matrix.env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.deploy.jsonc --env ${{ matrix.env }}
