# Release-gated deployment for workers/mcp-connector (Cloudflare Workers).
#
# RELEASE-GATED: fires when release-please publishes the `mcp-connector` release
# (tag `mcp-connector-vX.Y.Z`); merging a feature PR STAGES, merging the Release PR
# SHIPS. See docs/releases.md.
#
# Flow: the matrix is the server list in workers/mcp-connector/registry.json; per
# server: npm ci -> typecheck -> render -> `wrangler deploy --env <id>` (one Worker
# `mcp-connector-<id>` each). Code-only deploy: per-env secrets (UPSTREAM_BEARER,
# CF_ACCESS_*, Google OAuth) were set once by workers/mcp-connector/deploy.sh and
# persist across deploys. render-config.sh fills the private values (domain, group
# membership, KV id) from secrets on this environment (DOMAIN, ALLOWED_EMAILS,
# MCP_GROUPS, KV_ID_<ID>), so they are masked in the logs. Runs on GitHub-hosted
# runners (Cloudflare API, not the Pi).
#
# The `cloudflare-workers` environment holds secrets CLOUDFLARE_API_TOKEN
# (Workers Scripts:Edit, scoped to the account) and CLOUDFLARE_ACCOUNT_ID, and
# provides the audit trail + optional "Required reviewers" gate.
name: Deploy workers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      env:
        description: 'Single server id from registry.json to deploy, or all.'
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  servers:
    # Release event: only the mcp-connector component. Manual runs always pass.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'mcp-connector-v')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        working-directory: workers/mcp-connector
        env:
          ONLY: ${{ inputs.env || 'all' }}
        run: |
          ./render-config.sh --check
          matrix=$(jq -c --arg only "$ONLY" '[.servers | keys_unsorted[]
            | select($only == "all" or . == $only)
            | {id: ., kv: "KV_ID_\(ascii_upcase | gsub("-"; "_"))"}]
            | if length == 0 then error("no server \($only) in registry.json") end' registry.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    needs: servers
    runs-on: ubuntu-latest
    environment: cloudflare-workers
    defaults:
      run:
        working-directory: workers/mcp-connector
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.servers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/mcp-connector/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Render wrangler config
        # Secrets, not variables: secret values are masked everywhere in the log,
        # including this step's env header.
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          MCP_GROUPS: ${{ secrets.MCP_GROUPS }}
          KV_ID: ${{ secrets[matrix.server.kv] }}
        run: |
          export "${{ matrix.server.kv }}=$KV_ID"
          ./render-config.sh ${{ matrix.server.id }}

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.deploy.jsonc --env ${{ matrix.server.id }}
