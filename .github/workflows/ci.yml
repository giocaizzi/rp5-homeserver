# CI: `make check` (compose/shell lint), gitleaks, and cloud/ Terraform plan
# (PRs only). Add jobs to `check.needs` without changing the required check.
#
# Design notes:
#   - Workflow always triggers on PRs and pushes to main (no top-level path
#     filter) so the `check` job always reports a status. The required check
#     is therefore stable across PRs that don't touch cloud/**.
#   - `detect` decides whether cloud/** actually changed; downstream jobs use
#     that output to decide whether to do real work or short-circuit.
#   - `check` runs after all other jobs with `if: always()` and asserts that
#     none of them failed. That single job name (`check`) is what you add to
#     the branch ruleset as the required status check.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # post plan comment
  id-token: write        # WIF OIDC token for GCP

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cloud:
              - 'cloud/**'
              - '.github/workflows/ci.yml'

  tf-checks:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    environment: cloud-plan   # holds the cloud/ secrets (environment-scoped, never repo-wide)
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.9.8' }}
          terraform_wrapper: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform validate
        run: terraform validate

      - name: Mask private inputs
        # Secrets are masked as whole strings only; mask each email of the JSON-array
        # user lists so plan/apply output never shows one.
        env:
          N8N_USERS: ${{ secrets.N8N_USERS }}
          PORTAINER_USERS: ${{ secrets.PORTAINER_USERS }}
          BACKREST_USERS: ${{ secrets.BACKREST_USERS }}
          FIREFLY_USERS: ${{ secrets.FIREFLY_USERS }}
          HOMEPAGE_USERS: ${{ secrets.HOMEPAGE_USERS }}
          OPENCLAW_USERS: ${{ secrets.OPENCLAW_USERS }}
          GRAFANA_USERS: ${{ secrets.GRAFANA_USERS }}
          GREENHOUSE_USERS: ${{ secrets.GREENHOUSE_USERS }}
          CODE_USERS: ${{ secrets.CODE_USERS }}
          CRM_USERS: ${{ secrets.CRM_USERS }}
          CALIBRE_USERS: ${{ secrets.CALIBRE_USERS }}
          MCP_STDIO_USERS: ${{ secrets.MCP_STDIO_USERS }}
        run: |
          for n in N8N_USERS PORTAINER_USERS BACKREST_USERS FIREFLY_USERS HOMEPAGE_USERS OPENCLAW_USERS GRAFANA_USERS GREENHOUSE_USERS CODE_USERS CRM_USERS CALIBRE_USERS MCP_STDIO_USERS; do
            [ -n "${!n:-}" ] || continue
            jq -r '.[]' <<< "${!n}" | while IFS= read -r e; do [ -n "$e" ] && echo "::add-mask::$e"; done
          done

      - name: terraform plan
        id: plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_name: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_tunnel_secret: ${{ secrets.TUNNEL_SECRET }}
          TF_VAR_n8n_users: ${{ secrets.N8N_USERS || '[]' }}
          TF_VAR_portainer_users: ${{ secrets.PORTAINER_USERS || '[]' }}
          TF_VAR_backrest_users: ${{ secrets.BACKREST_USERS || '[]' }}
          TF_VAR_firefly_users: ${{ secrets.FIREFLY_USERS || '[]' }}
          TF_VAR_homepage_users: ${{ secrets.HOMEPAGE_USERS || '[]' }}
          TF_VAR_openclaw_users: ${{ secrets.OPENCLAW_USERS || '[]' }}
          TF_VAR_grafana_users: ${{ secrets.GRAFANA_USERS || '[]' }}
          TF_VAR_greenhouse_users: ${{ secrets.GREENHOUSE_USERS || '[]' }}
          TF_VAR_code_users: ${{ secrets.CODE_USERS || '[]' }}
          TF_VAR_crm_users: ${{ secrets.CRM_USERS || '[]' }}
          TF_VAR_calibre_users: ${{ secrets.CALIBRE_USERS || '[]' }}
          TF_VAR_mcp_stdio_users: ${{ secrets.MCP_STDIO_USERS || '[]' }}
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
          TF_VAR_gcp_backup_bucket_name: ${{ secrets.GCP_BACKUP_BUCKET_NAME }}
          TF_VAR_backup_retention_days: ${{ vars.BACKUP_RETENTION_DAYS }}
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=2m | tee plan.txt
          # The log is masked, the PR comment is not: IDs in refresh lines and
          # provider-returned values (DNS names) are never `sensitive`. Scrub every
          # LEAK_PATTERNS value and user email before the plan leaves the runner.
          python3 - plan.txt <<'PY'
          import json, os, sys
          vals = [v.strip() for v in os.environ.get("LEAK_PATTERNS", "").splitlines()]
          for k, v in os.environ.items():
              if k.startswith("TF_VAR_") and k.endswith("_users"):
                  vals += json.loads(v or "[]")
          p = sys.argv[1]
          s = open(p).read()
          for v in sorted({v for v in vals if v}, key=len, reverse=True):
              s = s.replace(v, "***")
          open(p, "w").write(s)
          PY
          {
            echo 'plan<<TFPLAN_EOF'
            tail -c 60000 plan.txt
            echo 'TFPLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v9
        with:
          script: |
            const plan = `${{ steps.plan.outputs.plan }}`;
            const body = [
              '### Terraform plan — `cloud/`',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Terraform plan — `cloud/`';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # `make check`: docker compose config + shellcheck (see Makefile).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required status check. Set THIS one in the branch ruleset.
  # Robust to:
  #   - skipped jobs (no cloud/** changes → tf-checks is skipped, check still passes)
  #   - new jobs added later (just add to `needs:` and check keeps gating)
  #   - job renames (rename here too; the public check name `check` is stable)
  # lint and secrets must succeed (skipped fails); detect/tf-checks may skip.
  check:
    needs: [detect, tf-checks, lint, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert no upstream job failed or was cancelled
        run: |
          set -e
          fail=0
          for r in "${{ needs.detect.result }}" "${{ needs.tf-checks.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "Upstream result: $r"; fail=1 ;;
            esac
          done
          for r in "${{ needs.lint.result }}" "${{ needs.secrets.result }}"; do
            [ "$r" = success ] || { echo "Upstream result: $r"; fail=1; }
          done
          exit $fail
