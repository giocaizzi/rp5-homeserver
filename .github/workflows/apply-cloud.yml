# Continuous deployment for cloud/ Terraform on push to main.
#
# Terraform is delivered PLAN-REVIEWED-ON-MERGE, NOT release-gated: ci.yml posts
# the plan on the PR, merging applies it. (release-please still versions cloud as
# `cloud-vX.Y.Z` for the changelog/tag record — it does not gate this apply.)
# Release-gating Terraform would let main diverge from applied infra until a
# release is cut; only the runtime deploys (infra stack, services) are
# release-gated. See docs/releases.md.
#
# The `cloud-production` environment is what gives us:
#   - GitHub Deployments tab visibility (audit trail of every apply)
#   - Per-env secrets (every cloud/ secret lives here and on cloud-plan, never repo-wide)
#   - Optional human approval — enable "Required reviewers" in env settings
#     to gate applies; no workflow change needed.
name: Apply cloud

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/apply-cloud.yml'

permissions:
  contents: read
  id-token: write   # WIF

concurrency:
  group: cd
  cancel-in-progress: false   # never cancel an in-flight apply

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: cloud-production
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.9.8' }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Mask private inputs
        # Secrets are masked as whole strings only; mask each email of the JSON-array
        # user lists so plan/apply output never shows one.
        env:
          N8N_USERS: ${{ secrets.N8N_USERS }}
          PORTAINER_USERS: ${{ secrets.PORTAINER_USERS }}
          BACKREST_USERS: ${{ secrets.BACKREST_USERS }}
          FIREFLY_USERS: ${{ secrets.FIREFLY_USERS }}
          HOMEPAGE_USERS: ${{ secrets.HOMEPAGE_USERS }}
          OPENCLAW_USERS: ${{ secrets.OPENCLAW_USERS }}
          GRAFANA_USERS: ${{ secrets.GRAFANA_USERS }}
          GREENHOUSE_USERS: ${{ secrets.GREENHOUSE_USERS }}
          CODE_USERS: ${{ secrets.CODE_USERS }}
          CRM_USERS: ${{ secrets.CRM_USERS }}
          CALIBRE_USERS: ${{ secrets.CALIBRE_USERS }}
          MCP_STDIO_USERS: ${{ secrets.MCP_STDIO_USERS }}
        run: |
          for n in N8N_USERS PORTAINER_USERS BACKREST_USERS FIREFLY_USERS HOMEPAGE_USERS OPENCLAW_USERS GRAFANA_USERS GREENHOUSE_USERS CODE_USERS CRM_USERS CALIBRE_USERS MCP_STDIO_USERS; do
            [ -n "${!n:-}" ] || continue
            jq -r '.[]' <<< "${!n}" | while IFS= read -r e; do [ -n "$e" ] && echo "::add-mask::$e"; done
          done

      - name: terraform apply
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_name: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_tunnel_secret: ${{ secrets.TUNNEL_SECRET }}
          TF_VAR_n8n_users: ${{ secrets.N8N_USERS || '[]' }}
          TF_VAR_portainer_users: ${{ secrets.PORTAINER_USERS || '[]' }}
          TF_VAR_backrest_users: ${{ secrets.BACKREST_USERS || '[]' }}
          TF_VAR_firefly_users: ${{ secrets.FIREFLY_USERS || '[]' }}
          TF_VAR_homepage_users: ${{ secrets.HOMEPAGE_USERS || '[]' }}
          TF_VAR_openclaw_users: ${{ secrets.OPENCLAW_USERS || '[]' }}
          TF_VAR_grafana_users: ${{ secrets.GRAFANA_USERS || '[]' }}
          TF_VAR_greenhouse_users: ${{ secrets.GREENHOUSE_USERS || '[]' }}
          TF_VAR_code_users: ${{ secrets.CODE_USERS || '[]' }}
          TF_VAR_crm_users: ${{ secrets.CRM_USERS || '[]' }}
          TF_VAR_calibre_users: ${{ secrets.CALIBRE_USERS || '[]' }}
          TF_VAR_mcp_stdio_users: ${{ secrets.MCP_STDIO_USERS || '[]' }}
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
          TF_VAR_gcp_backup_bucket_name: ${{ secrets.GCP_BACKUP_BUCKET_NAME }}
          TF_VAR_backup_retention_days: ${{ vars.BACKUP_RETENTION_DAYS }}
        run: terraform apply -input=false -auto-approve -lock-timeout=5m
