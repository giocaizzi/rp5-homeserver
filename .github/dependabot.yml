# Dependabot keeps third-party version pins moving without manual chasing.
# Ecosystems active in this repo:
#   - github-actions    — action @vX refs in .github/workflows/*
#   - terraform         — provider + module versions in cloud/
#   - npm               — workers/mcp-connector (Cloudflare Worker)
#   - docker-compose    — exact image tags in infra/ and services/<stack>/ (one
#                         entry per stack, so each PR maps to one release-please
#                         component)
#
# docker-compose gets version updates only: Dependabot security updates do not
# support docker-compose.
#
# Groups: one PR per ecosystem for all version updates (each ecosystem maps to
# one release-please component), plus one for npm security fixes. Security PRs
# ignore version-update groups unless a group sets `applies-to: security-updates`.
#
# We pin actions to a major (e.g. @v6); Dependabot opens a PR only when a NEW
# major lands, so day-to-day patch/minor updates flow through transparently
# via the floating tag and don't churn the PR queue.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /cloud
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - terraform
    groups:
      terraform:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /workers/mcp-connector
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - npm
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # docker-compose: `fix(<stack>)` cuts a patch release of that component, so
  # merging the bump stages a deploy via the Release PR. Majors are left out of
  # the group and arrive as individual PRs for manual review.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(infra)"
    labels:
      - dependencies
    groups:
      portainer:
        # portainer-mcp must stay on the portainer-ee minor: one PR, manual merge
        patterns: ["portainer/*"]
      infra:
        patterns: ["*"]
        update-types: ["minor", "patch"]

