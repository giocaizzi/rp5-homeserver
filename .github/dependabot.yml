# Dependabot keeps third-party version pins moving without manual chasing.
# Ecosystems active in this repo:
#   - github-actions    — action @vX refs in .github/workflows/*
#   - terraform         — provider + module versions in cloud/
#   - npm               — workers/mcp-connector (Cloudflare Worker)
#
# Groups: one PR per ecosystem for all version updates (each ecosystem maps to
# one release-please component), plus one for npm security fixes. Security PRs
# ignore version-update groups unless a group sets `applies-to: security-updates`.
#
# We pin actions to a major (e.g. @v6); Dependabot opens a PR only when a NEW
# major lands, so day-to-day patch/minor updates flow through transparently
# via the floating tag and don't churn the PR queue.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /cloud
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - terraform
    groups:
      terraform:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /workers/mcp-connector
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - npm
    ignore:
      # 1.x needs a per-env canonical resource; held at 0.8.x until #254.
      - dependency-name: "@cloudflare/workers-oauth-provider"
        versions: [">= 0.9.0"]
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
