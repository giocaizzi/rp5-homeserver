# PostgreSQL Configuration for Shared Home Server Database
# Optimized for Raspberry Pi 5 ARM64 (8GB RAM)
# Service memory limit: 512M

# =============================================================================
# Memory Configuration
# =============================================================================
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
huge_pages = off

# =============================================================================
# Connections
# =============================================================================
# Shared by n8n, miniflux, crm, firefly + local connections
listen_addresses = '*'
max_connections = 60

# =============================================================================
# WAL Configuration
# =============================================================================
wal_level = replica
max_wal_size = 256MB
min_wal_size = 64MB
wal_compression = on
wal_buffers = 4MB

# =============================================================================
# Checkpoint Configuration
# =============================================================================
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# =============================================================================
# Planner Configuration (NVMe storage)
# =============================================================================
random_page_cost = 1.1
jit = off
max_parallel_workers_per_gather = 0
effective_io_concurrency = 200

# =============================================================================
# Logging
# =============================================================================
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# =============================================================================
# Autovacuum (reduced workers for ARM64)
# =============================================================================
autovacuum_max_workers = 2
autovacuum_vacuum_cost_limit = 100
