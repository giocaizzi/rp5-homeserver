# ========================================
# Infrastructure Services (always up with nginx)
# No error pages - if these fail, nginx fails
# ========================================

# Portainer - Container management
server {
    listen 443 ssl;
    http2 on;
    server_name portainer.home portainer.giocaizzi.xyz;

    include snippets/ssl-params.conf;

    # MCP (streamable HTTP) -> portainer-mcp sidecar (gate token + X-Portainer-API-Key
    # validated by the sidecar). Unbuffered, long-lived responses.
    location = /mcp {
        limit_req zone=general burst=20 nodelay;
        set $upstream "infra_management-mcp:17717";
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-streaming.conf;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location / {
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/websocket-support.conf;
    }
}

# Netdata - System monitoring
server {
    listen 443 ssl;
    http2 on;
    server_name netdata.home;

    include snippets/ssl-params.conf;

    location / {
        limit_req zone=general burst=20 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/websocket-support.conf;
    }
}

# Netdata MCP - public MCP-only host (the UI stays LAN-only on netdata.home).
# Netdata serves /mcp natively; its MCP key is validated by the agent.
server {
    listen 443 ssl;
    http2 on;
    server_name netdata-mcp.giocaizzi.xyz;

    include snippets/ssl-params.conf;

    location = /mcp {
        limit_req zone=general burst=20 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-streaming.conf;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}

# Backrest - Backup management
server {
    listen 443 ssl;
    http2 on;
    server_name backrest.home backrest.giocaizzi.xyz;

    include snippets/ssl-params.conf;

    location / {
        limit_req zone=general burst=20 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/websocket-support.conf;
        include snippets/timeouts-long.conf;
    }
}

# Homepage - Dashboard
server {
    listen 443 ssl;
    http2 on;
    server_name homepage.home homepage.giocaizzi.xyz;

    include snippets/ssl-params.conf;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/static-assets.conf;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/websocket-support.conf;
    }
}
