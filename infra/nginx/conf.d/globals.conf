# Backend mappings - single source of truth for service addresses
map $host $backend {
    # hostnames: "<sub>.*" matches the public host on any domain (the domain is
    # not committed); exact .home names take precedence over these masks.
    # Public-only hosts use "~^<sub>\.(?!home$)" so <sub>.home stays unmatched.
    hostnames;

    # Infra (always up with nginx)
    portainer.home          "infra_management:9000";
    portainer.* "infra_management:9000";
    netdata.home            "infra_monitoring:19999";
    "~^netdata-mcp\.(?!home$)" "infra_monitoring:19999";
    backrest.home           "infra_backup:9898";
    backrest.*  "infra_backup:9898";
    homepage.home           "infra_dashboard:3000";
    homepage.*  "infra_dashboard:3000";
    
    # Services (may be down)
    n8n.home                "n8n_app:5678";
    n8n.*       "n8n_app:5678";
    ai.home                 "ai_llm:11434";
    chat.home               "ai_chat:8080";
    adguard.home            "adguard_dns:3000";
    grafana.home            "observability_dashboard:3000";
    grafana.*   "observability_dashboard:3000";
    langfuse.home           "langfuse_app:3000";
    "~^langfuse-mcp\.(?!home$)" "langfuse_app:3000";
    ntfy.home               "ntfy_app:80";
    ntfy.*      "ntfy_app:80";
    otel.home               "observability_collector:4318";
    otel.*      "observability_collector:4318";
    firefly.home            "firefly_app:8080";
    firefly.*   "firefly_app:8080";
    firefly-importer.home   "firefly_importer:8080";
    openclaw.home           "openclaw_gateway:18789";
    openclaw.*  "openclaw_gateway:18789";
    greenhouse.home          "greenhouse_app:8000";
    "~^greenhouse\.(?!home$)" "greenhouse_app:8000";
    code.home                "code_app:3001";
    code.*       "code_app:3001";
    "~^crm\.(?!home$)"        "crm_server:3000";
    "~^calibre\.(?!home$)"    "calibre_app:8083";
    "~^mcp-stdio\.(?!home$)"  "mcp-stdio_gateway:8000";

    default                 "";
}

# Rate limiting zones
# Reject with 429 (default 503 counts as a 5xx and trips Nginx 5xx Error Ratio High)
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=assets:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
# Calibre reader paths (/opds, /kosync, /kobo). Keyed on the real client IP
# (calibre.conf trusts CF-Connecting-IP from cloudflared), generous enough for
# Kobo/KOReader sync bursts.
limit_req_zone $binary_remote_addr zone=calibre_readers:10m rate=10r/s;

# Access log without the request URI, for paths that carry a token in the path
# (Calibre /kobo/<token>/...).
log_format no_uri '$remote_addr - $remote_user [$time_local] "$request_method" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  '$server_name $request_time';
