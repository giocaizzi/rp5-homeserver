# Calibre - Calibre-Web-Automated (UI + OPDS + KOReader/Kobo sync)
# Public only: gated by Cloudflare Access (UI: email allowlist; /opds, /kosync,
# /kobo bypass Access and rely on CWA's own auth).
server {
    listen 443 ssl;
    http2 on;
    server_name "~^calibre\.(?!home$)";

    include snippets/ssl-params.conf;
    include snippets/cf-access.conf;
    include snippets/error-503.conf;

    # /kobo/<token>/... is logged without its path (globals.conf)
    access_log /var/log/nginx/access.log main if=$log_full_uri;
    access_log /var/log/nginx/access.log no_uri if=$kobo_token_path;

    # Book uploads
    client_max_body_size 100m;

    # Reader apps (Access bypass, CWA Basic auth only): rate-limit password
    # guessing per real client (globals.conf). burst/delay absorb a
    # Kobo/KOReader sync (covers, metadata).
    location ~ ^/(opds|kosync) {
        limit_req zone=calibre_readers burst=100 delay=50;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-long.conf;
    }

    # Kobo sync: the auth token is in the path (/kobo/<token>/...). error.log
    # lines (limit_req, upstream errors) quote the request line, so only crit
    # reaches it; 429/5xx still show in access.log.
    location /kobo {
        limit_req zone=calibre_readers burst=100 delay=50;
        error_log /var/log/nginx/error.log crit;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-long.conf;
    }

    # Generous burst: all public traffic arrives from the tunnel IP, so a
    # tight per-IP limit 503s the UI (see crm.conf).
    location / {
        limit_req zone=general burst=200 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-long.conf;
    }
}
