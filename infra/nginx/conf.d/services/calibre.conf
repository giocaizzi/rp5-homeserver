# Calibre - Calibre-Web-Automated (UI + OPDS + KOReader/Kobo sync)
# Public only: gated by Cloudflare Access (UI: email allowlist; /opds, /kosync,
# /kobo bypass Access and rely on CWA's own auth).
server {
    listen 443 ssl;
    http2 on;
    server_name "~^calibre\.(?!home$)";

    include snippets/ssl-params.conf;
    include snippets/error-503.conf;

    # Real client IP from cloudflared (rp5_infra, same subnet as
    # PORTAINER_MCP_FORWARDED_ALLOW_IPS), so limit_req is per client, not per
    # tunnel. Other sources keep their own address: the header can't be spoofed.
    set_real_ip_from 10.0.2.0/24;
    real_ip_header CF-Connecting-IP;

    # Book uploads
    client_max_body_size 100m;

    # Reader apps (Access bypass, CWA Basic auth only): rate-limit password
    # guessing. burst/delay absorb a Kobo/KOReader sync (covers, metadata).
    location ~ ^/(opds|kosync) {
        limit_req zone=calibre_readers burst=100 delay=50;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-long.conf;
    }

    # Kobo sync: the auth token is in the path (/kobo/<token>/...), keep it
    # out of the logs. error.log lines (limit_req, upstream errors) quote the
    # request line, so only crit reaches it; 429/5xx still show in access.log.
    location /kobo {
        limit_req zone=calibre_readers burst=100 delay=50;
        access_log /var/log/nginx/access.log no_uri;
        error_log /var/log/nginx/error.log crit;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-long.conf;
    }

    # UI: generous burst for page loads (assets).
    location / {
        limit_req zone=general burst=200 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-long.conf;
    }
}
