# MCP stdio - public MCP-only host for the supergateway stack (services/mcp-stdio).
# One Streamable HTTP endpoint per server at /<server>/mcp; each server checks its
# own API key (Worker UPSTREAM_BEARER). Everything else, /healthz included, is 404.
server {
    listen 443 ssl;
    http2 on;
    server_name "~^mcp-stdio\.(?!home$)";

    include snippets/ssl-params.conf;
    include snippets/cf-access.conf;
    include snippets/error-503.conf;

    location ~ ^/[a-z0-9-]+/mcp$ {
        limit_req zone=general burst=20 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-streaming.conf;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}
