# Grafana - Observability dashboards
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.home grafana.*;

    include snippets/ssl-params.conf;
    include snippets/error-503.conf;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/static-assets.conf;
    }

    # Grafana Live WebSocket endpoint
    location /api/live/ {
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/websocket-support.conf;
    }

    # MCP (streamable HTTP) -> grafana-mcp sidecar. Read-only; it holds the Grafana
    # service-account token. Public access is gated by CF Access + the mcp-connector Worker.
    # The sidecar has no inbound auth of its own, so refuse it on the LAN host.
    location = /mcp {
        if ($host = "grafana.home") { return 404; }
        limit_req zone=general burst=20 nodelay;
        set $upstream "observability_mcp:8000";
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-streaming.conf;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/websocket-support.conf;
    }
}
