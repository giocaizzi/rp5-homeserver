# CRM - Twenty (UI + REST/GraphQL API + MCP)
# Public only: SERVER_URL is https://crm.giocaizzi.xyz, so links/callbacks
# break on any other host. Gated by Cloudflare Access (UI: email allowlist;
# /rest, /graphql, /mcp: service tokens + Twenty API key).
server {
    listen 443 ssl;
    http2 on;
    server_name crm.giocaizzi.xyz;

    include snippets/ssl-params.conf;
    include snippets/error-503.conf;

    # Attachment uploads
    client_max_body_size 25m;

    # MCP (streamable HTTP) — unbuffered, long-lived responses
    location /mcp {
        limit_req zone=general burst=20 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/timeouts-streaming.conf;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Vite SPA chunks (content-hashed, hundreds per page load). No limit_req:
    # all public traffic arrives from the tunnel IP, so any per-IP limit here
    # 503s the UI (static-assets.conf's burst=50 is too small too).
    location /assets/ {
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # UI + REST/GraphQL (websocket for GraphQL subscriptions)
    location / {
        limit_req zone=general burst=50 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        include snippets/websocket-support.conf;
    }
}
