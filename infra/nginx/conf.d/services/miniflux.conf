# Miniflux - feed reader (UI + APIs)
# Public only: the whole host is gated by Cloudflare Access (email allowlist),
# no bypassed paths, so native reader apps (Fever, Google Reader) can't connect.
server {
    listen 443 ssl;
    http2 on;
    server_name "~^miniflux\.(?!home$)";

    include snippets/ssl-params.conf;
    include snippets/cf-access.conf;
    include snippets/error-503.conf;

    # Generous burst: all public traffic arrives from the tunnel IP, so a
    # tight per-IP limit 503s the UI (see crm.conf).
    location / {
        limit_req zone=general burst=200 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
    }
}
