# Pocket ID - OIDC provider (passkeys)
# Public only (passkeys are bound to the APP_URL domain, so no id.home).
# No Access app and no cf-access snippet on purpose: Cloudflare's servers call
# the token and JWKS endpoints, which an Access policy would block.
server {
    listen 443 ssl;
    http2 on;
    server_name "~^id\.(?!home$)";

    include snippets/ssl-params.conf;
    include snippets/error-503.conf;

    # Generous burst: all public traffic arrives from the tunnel IP (see crm.conf).
    location / {
        limit_req zone=general burst=200 nodelay;
        set $upstream $backend;
        proxy_pass http://$upstream;
        include snippets/proxy-headers.conf;
        # Pocket ID reads the client IP from this header (TRUSTED_PLATFORM)
        proxy_set_header CF-Connecting-IP $cf_client_ip;
        # Required by Pocket ID, else 502 "upstream sent too big header"
        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;
    }
}
