# Default server block - return 444 for unknown hosts
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    
    # Allow healthcheck
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Nginx stub_status for metrics exporter (internal only)
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;    # Docker overlay networks
        allow 172.16.0.0/12; # Docker bridge networks
        deny all;
    }
    
    # Reject all other requests
    location / {
        return 444;
    }
}

# HTTP to HTTPS redirect for all known hosts
server {
    listen 80;
    server_name
        # Infra
        portainer.home portainer.*
        netdata.home "~^netdata-mcp\.(?!home$)"
        backrest.home backrest.*
        homepage.home homepage.*
        # Services
        n8n.home n8n.*
        ai.home
        chat.home
        adguard.home
        grafana.home grafana.*
        langfuse.home "~^langfuse-mcp\.(?!home$)"
        ntfy.home ntfy.*
        otel.home otel.*
        firefly.home firefly.*
        firefly-importer.home
        openclaw.home openclaw.*
        "~^greenhouse\.(?!home$)"
        code.home code.*
        "~^crm\.(?!home$)"
        "~^calibre\.(?!home$)"
        "~^miniflux\.(?!home$)"
        "~^mcp-stdio\.(?!home$)"
        "~^id\.(?!home$)";
    return 301 https://$host$request_uri;
}
