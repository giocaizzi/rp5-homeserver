# Default server block - return 444 for unknown hosts
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    
    # Allow healthcheck
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Nginx stub_status for metrics exporter (internal only)
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;    # Docker overlay networks
        allow 172.16.0.0/12; # Docker bridge networks
        deny all;
    }
    
    # Reject all other requests
    location / {
        return 444;
    }
}

# HTTP to HTTPS redirect for all known hosts
server {
    listen 80;
    server_name
        # Infra
        portainer.home portainer.<domain>
        netdata.home
        backrest.home backrest.<domain>
        homepage.home homepage.<domain>
        # Services
        n8n.home n8n.<domain>
        ai.home
        chat.home
        adguard.home
        grafana.home grafana.<domain>
        langfuse.home
        ntfy.home ntfy.<domain>
        otel.home otel.<domain>
        firefly.home firefly.<domain>
        firefly-importer.home
        openclaw.home openclaw.<domain>
        greenhouse.<domain>
        code.home code.<domain>
        crm.<domain>;
    return 301 https://$host$request_uri;
}
