# Cloudflare Access JWT check at the origin (#393): anything reaching nginx
# directly (LAN, containers on the Docker networks) skips Access at the edge.
# Verifier: njs/cf_access.js via snippets/cf-access.conf. Rollout and rollback:
# docs/access-jwt.md.
js_path /etc/nginx/njs/;
js_import cf_access from cf_access.js;
js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
js_shared_dict_zone zone=cf_access:1m timeout=1h;

# Feature flag per public host: off | log | enforce (rollout: docs/access-jwt.md).
# Only hosts with a host-wide Access app (cloud/main.tf) are listed; otel,
# ntfy, netdata-mcp, langfuse-mcp and id (Pocket ID) have none and are never
# checked as a whole host (their service-token paths are: $cf_access_app below).
# *.home (LAN) wins over the masks and is never checked.
map $host $cf_access_mode {
    hostnames;
    default     off;
    *.home      off;

    portainer.* enforce;
    backrest.*  enforce;
    homepage.*  enforce;
    n8n.*       enforce;
    firefly.*   enforce;
    grafana.*   enforce;
    greenhouse.* enforce;
    code.*      enforce;
    crm.*       enforce;
    calibre.*   enforce;
    miniflux.*  enforce;
    mcp-stdio.* enforce;
}

# Main request's normalized path, for the verifier's log lines.
map $uri $cf_access_uri {
    default $uri;
}

# Paths whose Access app bypasses login, so no JWT reaches the origin
# (bypass policies issue none). Mirrors the path-scoped bypass apps in
# cloud/main.tf: keep both in sync. The app's own auth stays the gate there.
map "$host$uri" $cf_access_bypass {
    default 0;
    # IP bypass (claude.ai egress): CRM MCP + OAuth discovery
    "~^crm\.[^/]+/(mcp|oauth)(/|$)"          1;
    "~^crm\.[^/]+/\.well-known/oauth-(protected-resource|authorization-server)(/|$)" 1;
    # Everyone bypass: Calibre reader apps (CWA Basic auth)
    "~^calibre\.[^/]+/(opds|kosync|kobo)(/|$)" 1;
}

# Service Auth paths: Access issues a JWT whose aud is the PATH-SCOPED app's own
# tag, so the verifier looks that app key up in the secret instead of the host's.
# Key = first label of the app name in cloud/main.tf (keep in sync). The host
# part excludes LAN names (*.home is never checked).
map "$host$uri" $cf_access_app {
    default "";
    "~^n8n\.(?!home/)[^/]+/mcp-server(/|$)"           n8n-mcp;
    "~^portainer\.(?!home/)[^/]+/mcp(/|$)"            portainer-mcp;
    "~^firefly\.(?!home/)[^/]+/api/v1/mcp(/|$)"       firefly-mcp;
    "~^grafana\.(?!home/)[^/]+/mcp(/|$)"              grafana-mcp;
    "~^greenhouse\.(?!home/)[^/]+/mcp(/|$)"           greenhouse-mcp;
    "~^crm\.(?!home/)[^/]+/rest(/|$)"                 crm-api;
    "~^mcp-stdio\.(?!home/)[^/]+/fli/mcp$"            fli-mcp;
    "~^mcp-stdio\.(?!home/)[^/]+/garmin/mcp$"         garmin-mcp;
    "~^mcp-stdio\.(?!home/)[^/]+/surfline/mcp$"       surfline-mcp;
    "~^mcp-stdio\.(?!home/)[^/]+/lamma/mcp$"          lamma-mcp;
    "~^otel\.(?!home/)[^/]+/v1/"                      otel-ingest;
    "~^netdata-mcp\.(?!home/)[^/]+/mcp(/|$)"          netdata-mcp;
    "~^langfuse-mcp\.(?!home/)[^/]+/api/public/mcp(/|$)" langfuse-mcp;
}

# Mode per path app: a path-scoped Service Auth app has its own aud and its own
# mode, which wins over the host's $cf_access_mode (so enforced UI hosts stay
# enforced while their MCP paths are in log). Keep in sync with cloud/main.tf.
map $cf_access_app $cf_access_app_mode {
    default         "";
    n8n-mcp         log;
    portainer-mcp   log;
    firefly-mcp     log;
    grafana-mcp     log;
    greenhouse-mcp  log;
    crm-api         log;
    fli-mcp         log;
    garmin-mcp      log;
    surfline-mcp    log;
    lamma-mcp       log;
    otel-ingest     log;
    netdata-mcp     log;
    langfuse-mcp    log;
}
