# Cloudflare Access JWT check (conf.d/cf-access.conf). A no-op while the host's
# $cf_access_mode is off. Include in public server blocks only.
auth_request /_cf_access;

# Evaluate the path-based maps here, in the main request: the auth subrequest
# shares their cached values but has its own $uri (/_cf_access).
set $cf_access_skip $cf_access_bypass;
set $cf_access_path $cf_access_uri;

location = /_cf_access {
    internal;
    js_content cf_access.verify;
}
