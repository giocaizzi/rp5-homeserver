# Container RAM against its cgroup limit, sustained over 5 minutes. The stock
# cgroup_ram_in_use is `to: silent`; this variant pages via ntfy on critical
# (health_alarm_notify.conf). Fires per container that has a memory limit.
template: cgroup_ram_near_limit
      on: cgroup.mem_usage
  lookup: average -5m unaligned of ram
    calc: $this * 100 / $memory_limit
   units: %
   every: 1m
    warn: $this > 90
    crit: $this > 95
   delay: down 15m multiplier 1.5 max 1h
      to: sysadmin
 summary: ${label:cgroup_name} RAM near limit
    info: ${label:cgroup_name} used $this% of its memory limit over 5m; see docs/monitoring.md
