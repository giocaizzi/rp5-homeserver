# Used space on / (NVMe, holds /var/lib/docker). Baseline is ~45 GiB with the
# daily janitor prune; the stock 80% alarm only fires at ~1.4 TiB. Growth past
# these thresholds means the janitor stopped or something new fills the disk.
# Critical-only notifications reach ntfy (health_alarm_notify.conf).
alarm: root_disk_used
   on: disk_space./
lookup: average -10m unaligned of used
 units: GiB
 every: 10m
  warn: $this > 80
  crit: $this > 120
 delay: down 1h multiplier 1.5 max 6h
  info: Space used on / (normal ~45 GiB); check docs/monitoring.md#disk-hygiene
