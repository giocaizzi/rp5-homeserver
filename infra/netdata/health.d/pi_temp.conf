# Pi 5 SoC temperature (libsensors cpu_thermal; context system.hw.sensor.temperature.input).
# Pi 5 throttles ~80-85C. Critical-only notifications reach ntfy (health_alarm_notify.conf).
alarm: pi_cpu_temperature
   on: sensors.temperature_cpu_thermal-virtual-0_temp1_input
lookup: average -5m unaligned of input
 units: Celsius
 every: 1m
  warn: $this > 75
  crit: $this > 82
 delay: down 5m multiplier 1.5 max 1h
  info: Raspberry Pi 5 SoC temperature (5 min average); throttling starts around 80-85C
