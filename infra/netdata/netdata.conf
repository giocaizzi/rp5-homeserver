# Netdata Configuration
# Minimal setup optimized for low CPU overhead and reduced fan oscillations

[global]
    # hostname
    hostname = rp5-homeserver

    # Update interval - 13s for load distribution (staggered with other collectors)
    update every = 13
    
[db]
    # Storage engine (v2 names; v1 history/memory mode/page cache size/multihost disk space removed)
    db = dbengine
    dbengine page cache size = 32
    dbengine tier 0 retention size = 1024

[web]
    # Web server
    mode = static-threaded
    bind to = *
    
[health]
    # Health checks enabled
    enabled = yes
    # Notification repeat left at default (never): one ntfy push on raise, one on clear

[ml]
    # Anomaly detection off - training costs RAM/CPU, unused on a single node
    enabled = no

[plugins]
    # Collectors irrelevant to a single Pi node (key names as in netdata v2.12 [plugins])
    netflow = no
    otel = no
    tc = no
    statsd = no
    systemd-journal = no
    network-viewer = no
    scripts.d = no

[plugin:apps]
    # Per-process groups only - per-user/group charts duplicate the same data
    command options = without-users without-groups

[plugin:proc:/proc/net/dev]
    # Stock list + veth* (one per Swarm container, high churn, covered by cgroups)
    disable by default interfaces matching = lo fireqos* *-ifb fwpr* fwbr* fwln* ifb4* veth*
