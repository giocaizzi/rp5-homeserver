# Netdata alert notifications — sourced by alarm-notify.sh after the stock
# /usr/lib/netdata/conf.d/health_alarm_notify.conf, so only overrides live here.

SEND_EMAIL="NO"   # stock default; no mailer in the container, errors on every alarm
SEND_NTFY="YES"
NTFY_ACCESS_TOKEN="$(cat /run/secrets/ntfy_token)"
DEFAULT_RECIPIENT_NTFY="http://ntfy_app/rp5"
# Per-source tag on the shared rp5 topic. The stock send_ntfy() hardcodes `-H "Tags: <emoji>"`;
# ntfy reads X-Tags before Tags, and curl_options is word-split into every curl call, so the
# value must contain no spaces. Relies on alarm-notify.sh internals: re-check on a Netdata major upgrade.
curl_options="-H X-Tags:netdata,$(case "${status}" in CRITICAL) echo red_circle ;; CLEAR) echo white_check_mark ;; *) echo warning ;; esac)"

# Critical only: the stock ntfy sender ignores the "|critical" recipient modifier,
# so filter here ($status/$old_status are set before this file is sourced).
# Push CRITICAL and the CLEAR that ends a critical; drop warnings and other transitions.
if [ "${status}" != "CRITICAL" ] && ! { [ "${status}" = "CLEAR" ] && [ "${old_status}" = "CRITICAL" ]; }; then
  DEFAULT_RECIPIENT_NTFY=""
fi
