# Netdata alert notifications — sourced by alarm-notify.sh after the stock
# /usr/lib/netdata/conf.d/health_alarm_notify.conf, so only overrides live here.
# Critical alarms (and their clear) only: Pi warnings are too noisy to push.

SEND_NTFY="YES"
NTFY_ACCESS_TOKEN="$(cat /run/secrets/ntfy_token)"
DEFAULT_RECIPIENT_NTFY="http://ntfy_app/netdata|critical"
